<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="DistrictSync operations console: ingestion, reconciliation, cases, rules and platform health." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DistrictSync Console</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong scheme.
      (function () {
        try {
          var t = localStorage.getItem('ds.theme');
          var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) { /* storage unavailable */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
